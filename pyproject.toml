[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorsal-html-reports"
version = "0.1.0"
description = "Standalone HTML report generator for Dorsal JSON payloads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rio Achuzia", email = "rio@dorsalhub.com" }]

dependencies = [
    "jinja2>=3.1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/dorsal_html_reports"]
include = [
    "/src/dorsal_html_reports/templates/**/*.html",
    "/src/dorsal_html_reports/templates/**/*.css",
    "/src/dorsal_html_reports/templates/**/*.js",
    "/src/dorsal_html_reports/templates/**/*.txt",
    "/src/dorsal_html_reports/templates/**/*.py"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["F401"]

[tool.mypy]
mypy_path = "src"
warn_unreachable = true